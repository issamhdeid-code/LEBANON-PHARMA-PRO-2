<!DOCTYPE html>
<html>
<head>
<style>
  .expandable {
    field-sizing: content;
    min-width: 60px;
    max-width: 100%;
    border: 1px solid black;
    padding: 4px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 10px;
    width: 600px;
  }
  .col-1 { grid-column: span 1 / span 1; }
</style>
</head>
<body>
  <div class="grid">
    <div class="col-1"><input class="expandable" value="100000000"></div>
    <div class="col-1"><input class="expandable" value="10"></div>
  </div>
</body>
</html>
